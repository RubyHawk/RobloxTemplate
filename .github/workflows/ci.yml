name: CI

on:
  push:
    branches: [template, playable-starter]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Trust pinned tool publishers
        run: rokit trust rojo-rbx/rojo UpliftGames/wally Kampfkarren/selene JohnnyMorganz/StyLua lune-org/lune
      - run: rokit install
      - run: stylua --check src tests
      - run: selene src tests
      - run: wally install
      - run: rojo build default.project.json --output RobloxTemplate.rbxlx
      - run: lune run tests/run
      - run: npm ci --prefix worker
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      - run: python scripts/validate_skill.py .agents/skills/roblox-template
