name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Trust pinned tool publishers
        run: rokit trust rojo-rbx/rojo UpliftGames/wally Kampfkarren/selene JohnnyMorganz/StyLua lune-org/lune
      - run: rokit install
      - run: stylua --check src tests ui-packages
      - run: selene src tests ui-packages
      - run: lune run scripts/stagewright-import.luau stage-data/stagewright-project.json --check
      - run: wally install
      - run: rojo build bootstrap.project.json --output RobloxTemplate.rbxlx
      - run: rojo build patches/rng-defender-grid-demo.project.json --output RNGDefenderSafePatch.rbxlx
      - name: Figma bridge checks
        run: |
          node --check figma/roblox-ui-bridge/code.js
          for model in src/ui/presets/*/TemplateUI.model.json; do
            node scripts/figma-ui-bridge.mjs verify --model "$model"
          done
          node scripts/figma-ui-bridge.mjs self-test --model src/ui/presets/incremental/TemplateUI.model.json
      - name: Preset smoke builds (no Studio)
        run: |
          for recipe in config-presets/*.json; do
            pwsh -NoProfile -File scripts/build-game-preset.ps1 -RecipePath "$recipe" -NoStudio
          done
      - run: lune run scripts/validate-stagewright-artifact.luau
      - name: Launcher config guards (no Studio, no network)
        run: |
          pwsh -NoProfile -File scripts/sandbox.ps1 -RecipePath config-presets/incremental.json -SmokeTest
          pwsh -NoProfile -File scripts/start.ps1 -SmokeTest
      - run: pwsh -NoProfile -File scripts/sync-icon-manifest.ps1 -Check
      - run: lune run tests/run
      - run: lune run scripts/benchmark-stagewright.luau
      - run: npm ci --prefix worker
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      - run: python scripts/validate_skill.py .agents/skills/roblox-template
